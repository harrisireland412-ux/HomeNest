name: CI - API

on:
  push:
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: homenest
          POSTGRES_PASSWORD: homenest
          POSTGRES_DB: homenest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homenest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://homenest:homenest@localhost:5432/homenest
        run: uv run alembic upgrade head

      - name: Seed database
        env:
          DATABASE_URL: postgresql+asyncpg://homenest:homenest@localhost:5432/homenest
        run: uv run python -m app.db.seed

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://homenest:homenest@localhost:5432/homenest
          REDIS_URL: redis://localhost:6379/0
        run: uv run pytest
